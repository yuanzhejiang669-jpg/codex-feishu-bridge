<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'" />
  <title>Codex Feishu Bridge</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">CB</div>
        <div>
          <div class="brand-title">Feishu Bridge</div>
          <div class="brand-sub">统一三引擎控制台</div>
        </div>
      </div>

      <nav class="nav-group" aria-label="视图切换">
        <button class="nav-item active" type="button" data-view="overview">
          <span class="nav-left"><span>总览</span></span>
          <span class="nav-badge hidden" id="nav-badge-overview"></span>
        </button>
        <button class="nav-item" type="button" data-view="bots">
          <span class="nav-left"><span>Bot 中心</span></span>
          <span class="nav-badge" id="nav-badge-bots">0</span>
        </button>
        <button class="nav-item" type="button" data-view="providers">
          <span class="nav-left"><span>渠道与账号</span></span>
          <span class="nav-badge" id="nav-badge-providers">3 引擎</span>
        </button>
        <button class="nav-item" type="button" data-view="capabilities">
          <span class="nav-left"><span>工具与技能</span></span>
          <span class="nav-badge hidden" id="nav-badge-capabilities"></span>
        </button>
        <button class="nav-item" type="button" data-view="system">
          <span class="nav-left"><span>系统与诊断</span></span>
          <span class="nav-badge mono" id="app-version">v...</span>
        </button>
      </nav>

      <div class="sidebar-footer" id="sidebar-footer">
        <div class="sidebar-footer-row">
          <span>在线 Bot</span>
          <strong class="mono" id="footer-online">0 / 0</strong>
        </div>
        <div class="sidebar-footer-row">
          <span>运行中任务</span>
          <strong class="mono" id="footer-runs">0 活动</strong>
        </div>
        <div class="sidebar-footer-row">
          <span>运行模式</span>
          <span class="pill pill-neutral" id="footer-mode">加载中</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title-wrap">
          <h1 class="topbar-title" id="page-title">总览</h1>
          <span class="topbar-desc" id="page-desc">三引擎实时健康状态与待处理提醒</span>
        </div>
        <div class="topbar-actions">
          <button class="btn" type="button" id="btn-refresh">刷新状态</button>
          <button class="btn btn-primary" type="button" id="btn-open-wizard">+ 新建 Bot</button>
        </div>
      </header>

      <div class="content" id="main-content">
        <div class="loading-band" id="loading-band" role="status" aria-live="polite">
          <span>正在读取本机三引擎与受管 Bot 状态...</span>
        </div>

        <div class="error-band hidden" id="error-band" role="alert">
          <div class="error-band-main">
            <strong id="error-band-title">状态读取或启动初始化异常</strong>
            <div class="error-band-text" id="error-band-message"></div>
          </div>
          <div class="error-band-actions">
            <button class="btn btn-sm" type="button" id="btn-retry-state">重试刷新</button>
            <button class="btn btn-sm" type="button" id="btn-open-data-root">打开数据目录</button>
          </div>
        </div>

        <section class="view active" id="view-overview" aria-label="总览"></section>
        <section class="view" id="view-bots" aria-label="Bot 中心"></section>
        <section class="view" id="view-providers" aria-label="渠道与账号"></section>
        <section class="view" id="view-capabilities" aria-label="工具与技能"></section>
        <section class="view" id="view-system" aria-label="系统与诊断"></section>
      </div>
    </main>
  </div>

  <div class="drawer-backdrop" id="bot-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"></div>
  <div class="modal-backdrop" id="wizard-modal" role="dialog" aria-modal="true" aria-labelledby="wizard-title"></div>
  <div class="modal-backdrop" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
