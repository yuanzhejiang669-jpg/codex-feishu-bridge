appId: io.github.codex-feishu-bridge.desktop
productName: Codex Feishu Bridge
copyright: Copyright 2026 Codex Feishu Bridge contributors

directories:
  output: out

asar: true
npmRebuild: false

files:
  - src/**/*
  - package.json

extraResources:
  - from: resources/scripts
    to: scripts
    filter:
      - "**/*"
  - from: generated/engine
    to: engine
    filter:
      - "**/*"
  - from: node_modules/@larksuite/cli/LICENSE
    to: licenses/lark-cli-LICENSE
  - from: resources/licenses/node-LICENSE
    to: licenses/node-LICENSE
  - from: proxy-runtime/node_modules
    to: proxy/node_modules
    filter:
      - "**/*"

win:
  artifactName: Codex-Feishu-Bridge-Setup-${version}.${ext}
  icon: resources/icon.ico
  extraResources:
    - from: node_modules/@larksuite/cli/bin/lark-cli.exe
      to: tools/lark-cli.exe
    - from: node_modules/node/bin/node.exe
      to: tools/node.exe
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

mac:
  artifactName: Codex-Feishu-Bridge-${version}-mac-${arch}.${ext}
  icon: resources/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extraResources:
    - from: generated/tools/darwin-${arch}/lark-cli
      to: tools/lark-cli
    - from: generated/tools/darwin-${arch}/node
      to: tools/node
    - from: generated/tools/darwin-${arch}/manifest.json
      to: tools/manifest.json

dmg:
  sign: false

publish:
  provider: github
  owner: yuanzhejiang669-jpg
  repo: codex-feishu-bridge
