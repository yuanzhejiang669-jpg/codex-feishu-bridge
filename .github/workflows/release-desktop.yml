name: Release Desktop Clients

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/proxy-runtime/package-lock.json

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$($package.version)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test desktop client
        run: npm run check

      - name: Build and verify Windows release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            apps/desktop/out/Codex-Feishu-Bridge-Setup-*.exe
            apps/desktop/out/Codex-Feishu-Bridge-Setup-*.exe.blockmap
            apps/desktop/out/latest.yml
            apps/desktop/out/checksums.txt
            apps/desktop/out/checksums-windows.txt

  build-macos:
    runs-on: macos-15-intel
    env:
      HAS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/proxy-runtime/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate macOS release credential set
        shell: bash
        env:
          HAS_CERTIFICATE: ${{ secrets.MAC_CSC_LINK != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          values=("$HAS_CERTIFICATE" "$HAS_CERTIFICATE_PASSWORD" "$HAS_APPLE_ID" "$HAS_APP_PASSWORD" "$HAS_TEAM_ID")
          configured=0
          for value in "${values[@]}"; do
            [[ "$value" == "true" ]] && configured=$((configured + 1))
          done
          if [[ $configured -ne ${#values[@]} ]]; then
            echo "Stable desktop releases require the complete macOS signing/notarization secret set" >&2
            exit 1
          fi

      - name: Test desktop client
        run: npm run check

      - name: Build and verify macOS releases
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_SIGNING }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify signed and notarized macOS release
        if: ${{ env.HAS_MAC_SIGNING == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          apps=()
          while IFS= read -r app; do
            apps+=("$app")
          done < <(find out -type d -name 'Codex Feishu Bridge.app' -print)
          if [[ ${#apps[@]} -lt 2 ]]; then
            echo "Expected signed x64 and arm64 application bundles" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done
          dmgs=(out/Codex-Feishu-Bridge-*-mac-*.dmg)
          if [[ ${#dmgs[@]} -ne 2 ]]; then
            echo "Expected notarized x64 and arm64 DMGs, found ${#dmgs[@]}" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            xcrun stapler validate "$dmg"
          done

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            apps/desktop/out/Codex-Feishu-Bridge-*-mac-*.dmg
            apps/desktop/out/Codex-Feishu-Bridge-*-mac-*.zip
            apps/desktop/out/Codex-Feishu-Bridge-*-mac-*.zip.blockmap
            apps/desktop/out/latest-mac.yml
            apps/desktop/out/checksums-macos.txt

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ ${#assets[@]} -lt 9 ]]; then
            echo "Expected Windows and macOS assets, found ${#assets[@]}" >&2
            find release-assets -maxdepth 2 -type f -print >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Codex Feishu Bridge $GITHUB_REF_NAME" --generate-notes --latest
          fi
