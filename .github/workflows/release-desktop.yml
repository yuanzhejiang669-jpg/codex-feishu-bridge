name: Release Desktop Clients

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: ${{ !contains(github.ref_name, '-linux.') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/proxy-runtime/package-lock.json

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$($package.version)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test desktop client
        run: npm run check

      - name: Build and verify Windows release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            apps/desktop/out/Codex-Feishu-Bridge-Setup-*.exe
            apps/desktop/out/Codex-Feishu-Bridge-Setup-*.exe.blockmap
            apps/desktop/out/latest.yml
            apps/desktop/out/checksums.txt
            apps/desktop/out/checksums-windows.txt

  build-macos:
    if: ${{ !contains(github.ref_name, '-linux.') }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/proxy-runtime/package-lock.json

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($package.version)") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$($package.version)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test desktop client
        run: npm run check

      - name: Build and verify unsigned macOS releases
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            apps/desktop/out/Codex-Feishu-Bridge-*-mac-*.dmg
            apps/desktop/out/Codex-Feishu-Bridge-*-mac-*.zip
            apps/desktop/out/Codex-Feishu-Bridge-*-mac-*.zip.blockmap
            apps/desktop/out/latest-mac.yml
            apps/desktop/out/checksums-macos.txt

  build-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/proxy-runtime/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install dependencies
        run: npm ci

      - name: Test desktop client
        run: npm run check

      - name: Build and verify Ubuntu release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            apps/desktop/out/Codex-Feishu-Bridge-*-linux-amd64.deb
            apps/desktop/out/checksums-linux.txt

  publish:
    needs: [build-windows, build-macos, build-linux]
    if: ${{ !contains(github.ref_name, '-linux.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          version="${GITHUB_REF_NAME#v}"
          required=(
            "checksums-windows.txt"
            "checksums.txt"
            "Codex-Feishu-Bridge-Setup-${version}.exe"
            "Codex-Feishu-Bridge-Setup-${version}.exe.blockmap"
            "latest.yml"
            "checksums-macos.txt"
            "Codex-Feishu-Bridge-${version}-mac-x64.dmg"
            "Codex-Feishu-Bridge-${version}-mac-x64.zip"
            "Codex-Feishu-Bridge-${version}-mac-arm64.dmg"
            "Codex-Feishu-Bridge-${version}-mac-arm64.zip"
            "latest-mac.yml"
            "checksums-linux.txt"
            "Codex-Feishu-Bridge-${version}-linux-amd64.deb"
          )
          for name in "${required[@]}"; do
            if [[ ! -f "release-assets/$name" ]]; then
              echo "Missing required release asset: $name" >&2
              find release-assets -maxdepth 2 -type f -print >&2
              exit 1
            fi
          done
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            case "$name" in
              checksums-windows.txt|checksums.txt|checksums-macos.txt|checksums-linux.txt|latest.yml|latest-mac.yml|Codex-Feishu-Bridge-Setup-"${version}".exe|Codex-Feishu-Bridge-Setup-"${version}".exe.blockmap|Codex-Feishu-Bridge-"${version}"-mac-x64.dmg|Codex-Feishu-Bridge-"${version}"-mac-x64.zip|Codex-Feishu-Bridge-"${version}"-mac-x64.zip.blockmap|Codex-Feishu-Bridge-"${version}"-mac-arm64.dmg|Codex-Feishu-Bridge-"${version}"-mac-arm64.zip|Codex-Feishu-Bridge-"${version}"-mac-arm64.zip.blockmap|Codex-Feishu-Bridge-"${version}"-linux-amd64.deb) ;;
              *) echo "Unexpected release asset: $name" >&2; exit 1 ;;
            esac
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Codex Feishu Bridge $GITHUB_REF_NAME" --generate-notes --latest
          fi

  publish-linux:
    needs: [build-linux]
    if: ${{ contains(github.ref_name, '-linux.') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Ubuntu assets
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Publish isolated Ubuntu prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          deb="release-assets/Codex-Feishu-Bridge-${version}-linux-amd64.deb"
          checksums="release-assets/checksums-linux.txt"
          test -f "$deb"
          test -f "$checksums"
          grep -F "  $(basename "$deb")" "$checksums" >/dev/null
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$deb" "$checksums" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$deb" "$checksums" --repo "$GITHUB_REPOSITORY" \
              --title "Codex Feishu Bridge ${version} Ubuntu" --generate-notes --prerelease
          fi
